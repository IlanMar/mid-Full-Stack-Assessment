apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transaction-monitor
  template:
    metadata:
      labels:
        app: transaction-monitor
    spec:
      containers:
        - name: monitor
          image: transaction-monitor:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
